name: Deploy Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md"

      - name: Deploy CloudFront Function
        run: |
          FUNCTION_NAME="credtent-staging-rewrite-index"

          if aws cloudfront describe-function --name "$FUNCTION_NAME" > /dev/null 2>&1; then
            ETAG=$(aws cloudfront describe-function --name "$FUNCTION_NAME" --query 'ETag' --output text)
            aws cloudfront update-function \
              --name "$FUNCTION_NAME" \
              --function-config Comment="Rewrite directory paths to index.html",Runtime="cloudfront-js-2.0" \
              --function-code fileb://cloudfront-functions/rewrite-index.js \
              --if-match "$ETAG"
          else
            aws cloudfront create-function \
              --name "$FUNCTION_NAME" \
              --function-config Comment="Rewrite directory paths to index.html",Runtime="cloudfront-js-2.0" \
              --function-code fileb://cloudfront-functions/rewrite-index.js
          fi

          ETAG=$(aws cloudfront describe-function --name "$FUNCTION_NAME" --query 'ETag' --output text)
          aws cloudfront publish-function \
            --name "$FUNCTION_NAME" \
            --if-match "$ETAG"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
