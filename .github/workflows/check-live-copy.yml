name: Check live copy

# The copy gate for everything GitHub Pages publishes from main. The names list is a repository secret
# (CREDTENT_REVIEW_NAMES, one entry per line), never a file in this public repo; without it the job fails.
# Each entry is masked before any step runs, and once the gate exists on main, the gate scripts come from main
# so a pull request cannot change what checks it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Mask each names-list entry
        env:
          CREDTENT_REVIEW_NAMES: ${{ secrets.CREDTENT_REVIEW_NAMES }}
        run: |
          # Mask the raw line and the bare name of every entry kind (plain, drop:, block:, strip:, and
          # allow: <where> Name, prefixes in any case), plus its lowercase, upper-case, slug, no-space, hyphenated,
          # &amp;, %20 and &nbsp; forms. Masks are exact substrings, so the gates also hash names in what they print.
          printf '%s\n' "$CREDTENT_REVIEW_NAMES" | tr '|' '\n' | while IFS= read -r line; do
            raw="$(printf '%s' "$line" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            if [ -z "$raw" ]; then continue; fi
            echo "::add-mask::$raw"
            entry="$(printf '%s' "$raw" | sed -E 's/^(drop|block|strip):[[:space:]]*//I; s/^allow:[[:space:]]*[^[:space:]]+[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')"
            if [ -z "$entry" ]; then continue; fi
            lower="$(printf '%s' "$entry" | tr '[:upper:]' '[:lower:]')"
            slug="$(printf '%s' "$lower" | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
            compact="$(printf '%s' "$lower" | sed -E 's/[^a-z0-9]+//g')"
            upper="$(printf '%s' "$entry" | tr '[:lower:]' '[:upper:]')"
            hyphen="$(printf '%s' "$entry" | sed -E 's/[[:space:]]+/-/g')"
            nospace="$(printf '%s' "$entry" | sed -E 's/[[:space:]]+//g')"
            amp="$(printf '%s' "$entry" | sed -E 's/&/\&amp;/g')"
            pct="$(printf '%s' "$entry" | sed -E 's/[[:space:]]+/%20/g')"
            nbsp="$(printf '%s' "$entry" | sed -E 's/[[:space:]]+/\&nbsp;/g')"
            for v in "$entry" "$lower" "$upper" "$slug" "$compact" "$hyphen" "$nospace" "$amp" "$pct" "$nbsp"; do
              if [ "${#v}" -ge 3 ]; then echo "::add-mask::$v"; fi
            done
          done
      - uses: actions/checkout@v4
        with:
          path: tree
      - uses: actions/checkout@v4
        with:
          ref: main
          path: gate-main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pick the gate scripts
        run: |
          if [ -f gate-main/.github/scripts/check-live-copy.mjs ]; then echo "GATE=gate-main" >> "$GITHUB_ENV"; else echo "GATE=tree" >> "$GITHUB_ENV"; fi
      - name: Gate tests
        run: node --test "$GATE/.github/scripts/check-live-copy.test.mjs"
      - name: Live copy gate
        env:
          CREDTENT_REVIEW_NAMES: ${{ secrets.CREDTENT_REVIEW_NAMES }}
          CHECK_ROOT: tree
        run: node "$GATE/.github/scripts/check-live-copy.mjs"
